<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop Menu Mockup</title>
  <style>
    :root{
      --bg0:#070A14;
      --bg1:#0B1020;

      --glass: rgba(255,255,255,.06);
      --glass2: rgba(255,255,255,.035);
      --line: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.60);

      --teal:#2FE4D4;
      --violet:#6A3CF0;

      --r:22px;
      --pad:18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
      background:
        radial-gradient(900px 520px at 20% 45%, rgba(47,228,212,.30), transparent 55%),
        radial-gradient(900px 520px at 78% 48%, rgba(106,60,240,.35), transparent 58%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color:var(--text);
      padding:28px;
    }

    /* ===== The menu panel ===== */
    .menu{
      width:min(980px, 96vw);
      border-radius:var(--r);
      background: linear-gradient(90deg, rgba(47,228,212,.08), rgba(106,60,240,.10));
      position:relative;
      padding:1px; /* for border/glow */
      filter: drop-shadow(0 18px 40px rgba(0,0,0,.55));
    }

    .menu::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:calc(var(--r) + 2px);
      background: linear-gradient(90deg, rgba(47,228,212,.55), rgba(106,60,240,.55));
      opacity:.20;
      filter: blur(14px);
      z-index:-1;
    }

    .menu-inner{
      border-radius:var(--r);
      background: rgba(8,12,28,.64);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
    }

    .menu-header{
      padding:18px 22px 12px 22px;
      font-weight:800;
      letter-spacing:.12em;
      font-size:28px;
      text-transform:uppercase;
      color: rgba(210,245,255,.92);
      text-shadow: 0 0 18px rgba(47,228,212,.25);
      border-bottom:1px solid rgba(255,255,255,.08);
      background: linear-gradient(90deg, rgba(47,228,212,.07), rgba(106,60,240,.06));
    }

    .menu-grid{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:0;
      min-height:360px;
    }

    /* ===== Left + right columns ===== */
    .col{
      padding:16px;
      position:relative;
    }

    .col.left{
      border-right:1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(47,228,212,.06), transparent 55%);
    }

    .col.right{
      background: linear-gradient(180deg, rgba(106,60,240,.06), transparent 60%);
    }

    /* ===== Lists ===== */
    .list{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      cursor:pointer;
      user-select:none;
      transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease, color .14s ease;
    }

    .item .label{
      font-size:20px;
      letter-spacing:.01em;
    }

    .item .chev{
      width:18px; height:18px;
      opacity:.7;
      transform: translateX(0);
      transition: transform .14s ease, opacity .14s ease;
      flex:0 0 auto;
    }

    /* Hover */
    .item:hover{
      color: rgba(255,255,255,.90);
      border-color: rgba(47,228,212,.22);
      background: linear-gradient(90deg, rgba(47,228,212,.14), rgba(255,255,255,.02));
      box-shadow:
        0 0 0 1px rgba(47,228,212,.12) inset,
        0 10px 24px rgba(0,0,0,.35),
        0 0 26px rgba(47,228,212,.14);
      transform: translateY(-1px);
    }
    .item:hover .chev{ opacity:.95; transform: translateX(2px); }

    /* Active (match mockup highlight) */
    .item.active{
      color: rgba(255,255,255,.95);
      border-color: rgba(47,228,212,.35);
      background: linear-gradient(90deg, rgba(47,228,212,.22), rgba(106,60,240,.06));
      box-shadow:
        0 0 0 1px rgba(47,228,212,.18) inset,
        0 0 28px rgba(47,228,212,.18);
    }

    /* Right list separators feel */
    .right .item{
      background: rgba(255,255,255,.02);
      border-color: rgba(255,255,255,.07);
    }
    .right .item:hover{
      border-color: rgba(106,60,240,.26);
      background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(106,60,240,.12));
      box-shadow:
        0 0 0 1px rgba(106,60,240,.12) inset,
        0 10px 24px rgba(0,0,0,.35),
        0 0 26px rgba(106,60,240,.14);
    }

    /* Small caption line (optional, subtle) */
    .subtle{
      margin:10px 2px 14px 2px;
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color: rgba(255,255,255,.38);
    }

    /* Responsive: stack columns */
    @media (max-width: 720px){
      .menu-grid{ grid-template-columns: 1fr; }
      .col.left{ border-right:none; border-bottom:1px solid rgba(255,255,255,.08); }
    }
  </style>
</head>

<body>
  <section class="menu" aria-label="Shop menu">
    <div class="menu-inner">
      <div class="menu-header">SHOP</div>

      <div class="menu-grid">
        <!-- LEFT: categories -->
        <div class="col left">
          <div class="subtle">Categories</div>
          <ul class="list">
            <li class="item active">
              <span class="label">Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Shirts</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Shorts</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Hats</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Bags</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Sale</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
          </ul>
        </div>

        <!-- RIGHT: subcategories (Hoodies selected) -->
        <div class="col right">
          <div class="subtle">Hoodies</div>
          <ul class="list">
            <li class="item">
              <span class="label">Unisex Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Crop Top Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Zipper Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">Oversized Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
            <li class="item">
              <span class="label">View All Hoodies</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
