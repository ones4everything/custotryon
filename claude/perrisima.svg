<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">

  <defs>
    <!-- Soft background halo -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- HALO BACKGROUND (transparent edges) -->
  <ellipse cx="600" cy="340" rx="520" ry="240"
           fill="url(#haloGrad)"/>

  <!-- LOGO GROUP -->
  <g filter="url(#logoShadow)">
    <!-- OPTION A: place your SVG logo paths here -->

    <!-- OPTION B: use raster logo (PNG with transparency) -->
    <image href="perrisima-logo.png"
           x="260" y="150"
           width="680"
           preserveAspectRatio="xMidYMid meet"/>
  </g>

</svg>
